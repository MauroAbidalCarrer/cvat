metadata:
  name: custom-sam2-video-tracker
  namespace: cvat
  annotations:
    name: SAM2 Video Tracker
    type: tracker
    framework: pytorch
    spec: |
      [
        { "id": 0, "name": "Object" }
      ]

spec:
  description: SAM2 video tracker (logging test)
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s

  build:
    image: cvat.custom.sam2.video.tracker
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: >
            apt-get update &&
            apt-get -y install python3 python3-pip &&
            ln -s /usr/bin/python3 /usr/bin/python

  triggers:
    myHttpTrigger:
      maxWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 30000
      attributes:
        maxRequestBodySize: 67108864

  platform:
    attributes:
      network: cvat_cvat
